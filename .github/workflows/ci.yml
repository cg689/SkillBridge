name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-json:
    name: Validate JSON config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON configs
        run: |
          python - <<'EOF'
          import json
          for name in ("config.example.json", "supported-tools.json"):
              with open(name, encoding="utf-8") as fh:
                  json.load(fh)
              print(f"{name}: OK")
          EOF
      - name: Catalog + database-alignment tests
        run: |
          python tests/test-catalog.py
          python tests/test-check-db-sync.py

  powershell:
    name: Lint + smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check all .ps1 files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errs = $null
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count) { Write-Error "$($_.Name): $($errs -join '; ')" }
          }
          Write-Host "All PowerShell files parse OK"
      - name: Functional smoke test
        shell: pwsh
        run: |
          .\tests\smoke-windows.ps1
      - name: AutoLink dry-run (no real registration)
        shell: pwsh
        run: |
          $out = .\install-autolink.ps1 -DryRun
          if ($out -notmatch 'DRY-RUN') { throw "expected DRY-RUN output, got: $out" }
          $t = Get-ScheduledTask -TaskName 'CCSwitch Skills AutoLink' -ErrorAction SilentlyContinue
          if ($null -ne $t) { throw "dry-run must not register the task" }
          Write-Host "OK: autolink dry-run (no task registered)"

  shell:
    name: Lint + smoke test (Unix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (bash -n)
        run: |
          bash -n sync-skills.sh
          bash -n install-autolink.sh
          bash -n detect-tools.sh
          bash -n tests/smoke-unix.sh
          echo "Bash syntax OK"
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
      - name: Functional smoke test
        run: |
          bash tests/smoke-unix.sh
      - name: AutoLink dry-run (no real registration)
        run: |
          bash install-autolink.sh --dry-run | grep -q 'DRY-RUN'
          echo "OK: autolink dry-run"
