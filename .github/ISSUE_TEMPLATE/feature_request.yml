name: Feature request
description: Suggest an idea for SkillBridge
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting! A clear use case makes it much more likely to be addressed.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should the new behavior be?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
  - type: input
    id: tool
    attributes:
      label: Related tool (if any)
      description: e.g. add support for a new AI coding tool
